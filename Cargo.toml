[package]
name = "nowplaying"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "nowplaying"
path = "src/main.rs"

[[bin]]
name = "spike_dealer"
path = "src/bin/spike_dealer.rs"

[dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures-util = "0.3"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "chrono", "migrate", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
lru = "0.18"
anyhow = "1"
protobuf = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
tracing-opentelemetry = "0.34"
opentelemetry-appender-tracing = "0.33"

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
# zonky statt theseus: die zonky-Archive bündeln ihre Shared Libraries
# (libxml2, libicu, …) selbst; theseus-Builds erwarten sie vom Host.
postgresql_archive = { version = "0.21.0", default-features = false, features = ["zonky"] }
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["zonky", "tls-rustls-aws-lc-rs"] }
reqwest = { version = "0.13", default-features = false }
tokio-tungstenite = "0.30"
proptest = "1.11"

[profile.release]
lto = "thin"
strip = "symbols"
