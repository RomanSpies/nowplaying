# nginx vhost for nowplaying — terminates TLS and proxies to the app's
# loopback HTTP listener (NP_BIND_ADDR, default 127.0.0.1:8080).
#
#   sudo cp deploy/nginx-nowplaying.conf /etc/nginx/conf.d/nowplaying.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert paths assume certbot with the nginx installer (which also handles
# renewals — the in-app cert reload of earlier versions is gone).

# WebSocket upgrade: forward Connection: upgrade only when the client asked
# for an upgrade, plain "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nowplaying.rospies.dev;

    ssl_certificate     /etc/letsencrypt/live/nowplaying.rospies.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nowplaying.rospies.dev/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The app takes the RIGHTMOST entry of this header as client.address —
        # $proxy_add_x_forwarded_for appends the real peer, so client-supplied
        # values can never win.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws (harmless for the plain API routes).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The app pings idle WS clients every 30s; 75s leaves room for two
        # missed intervals before nginx cuts the connection.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name nowplaying.rospies.dev;
    return 301 https://$host$request_uri;
}
